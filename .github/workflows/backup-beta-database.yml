name: Backup beta database

on:
  workflow_dispatch:
    inputs:
      age_recipient:
        description: Public age X25519 recipient (age1...), never a private key or passphrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beta-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    environment: beta
    timeout-minutes: 20
    env:
      AGE_RECIPIENT: ${{ inputs.age_recipient }}
      DEPLOY_HOST: ${{ secrets.BETA_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.BETA_DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.BETA_DEPLOY_KEY }}
      DEPLOY_PORT: ${{ secrets.BETA_DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.BETA_DEPLOY_PATH }}
      KNOWN_HOSTS: ${{ secrets.BETA_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == "refs/heads/beta" ]] || {
            echo "This workflow must be dispatched from the beta branch."
            exit 1
          }

          [[ -n "$DEPLOY_HOST" ]] || { echo "BETA_DEPLOY_HOST is not configured in the beta environment."; exit 1; }
          [[ -n "$DEPLOY_USER" ]] || { echo "BETA_DEPLOY_USER is not configured in the beta environment."; exit 1; }
          [[ -n "$DEPLOY_KEY" ]] || { echo "BETA_DEPLOY_KEY is not configured in the beta environment."; exit 1; }
          [[ -n "$KNOWN_HOSTS" ]] || { echo "BETA_DEPLOY_KNOWN_HOSTS is not configured in the beta environment."; exit 1; }

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/mychurch}"

          [[ "$DEPLOY_HOST" =~ ^([A-Za-z0-9.-]+|\[[0-9A-Fa-f:]+\])$ ]] || {
            echo "BETA_DEPLOY_HOST contains unsupported characters."
            exit 1
          }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || {
            echo "BETA_DEPLOY_USER contains unsupported characters."
            exit 1
          }
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || (( DEPLOY_PORT < 1 || DEPLOY_PORT > 65535 )); then
            echo "BETA_DEPLOY_PORT must be an integer from 1 through 65535."
            exit 1
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "$DEPLOY_PATH" =~ (^|/)\.\.(/|$) ]]; then
            echo "BETA_DEPLOY_PATH must be an absolute path without whitespace or parent traversal."
            exit 1
          fi
          [[ "$AGE_RECIPIENT" =~ ^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$ ]] || {
            echo "age_recipient must be a public age X25519 recipient beginning with age1."
            exit 1
          }

          printf 'DEPLOY_PORT=%s\n' "$DEPLOY_PORT" >> "$GITHUB_ENV"
          printf 'DEPLOY_PATH=%s\n' "$DEPLOY_PATH" >> "$GITHUB_ENV"

      - name: Install backup tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

          age_version="1.2.1"
          age_archive="$RUNNER_TEMP/age-v${age_version}-linux-amd64.tar.gz"
          age_url="https://github.com/FiloSottile/age/releases/download/v${age_version}/age-v${age_version}-linux-amd64.tar.gz"
          age_sha256="7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50"

          curl --fail --silent --show-error --location --retry 3 --output "$age_archive" "$age_url"
          printf '%s  %s\n' "$age_sha256" "$age_archive" | sha256sum --check --strict

          install -m 700 -d "$RUNNER_TEMP/age-bin"
          tar -xzf "$age_archive" -C "$RUNNER_TEMP/age-bin" --strip-components=1 age/age
          chmod 700 "$RUNNER_TEMP/age-bin/age"
          printf '%s\n' "$RUNNER_TEMP/age-bin" >> "$GITHUB_PATH"

      - name: Validate age recipient
        shell: bash
        run: |
          set -euo pipefail
          printf 'recipient validation' |
            "$RUNNER_TEMP/age-bin/age" --encrypt --recipient "$AGE_RECIPIENT" --output /dev/null

      - name: Configure SSH
        shell: bash
        env:
          SSH_DIR: ${{ runner.temp }}/beta-backup-ssh
        run: |
          set -euo pipefail
          install -m 700 -d "$SSH_DIR"
          printf '%s\n' "$DEPLOY_KEY" > "$SSH_DIR/key"
          chmod 600 "$SSH_DIR/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/known_hosts"

      - name: Stream, validate, and encrypt beta backup
        shell: bash
        env:
          BACKUP_DIR: ${{ runner.temp }}/beta-backup
          SSH_DIR: ${{ runner.temp }}/beta-backup-ssh
        run: |
          set -euo pipefail
          umask 077
          install -m 700 -d "$BACKUP_DIR"

          dump_path="$BACKUP_DIR/beta-postgres.dump"
          encrypted_path="$dump_path.age"
          remote_script="$BACKUP_DIR/read-only-pg-dump.sh"

          cat > "$remote_script" <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          readonly deploy_path="$1"
          readonly env_file="$deploy_path/.env"

          [[ -r "$env_file" ]] || {
            echo "The remote deployment .env file is not readable." >&2
            exit 1
          }
          command -v node >/dev/null || {
            echo "Node.js is required on the remote host." >&2
            exit 1
          }
          command -v pg_dump >/dev/null || {
            echo "pg_dump is required on the remote host." >&2
            exit 1
          }

          node - "$env_file" <<'NODE_SCRIPT'
          const fs = require("node:fs");
          const { spawn } = require("node:child_process");

          const envFile = process.argv[2];
          const contents = fs.readFileSync(envFile, { encoding: "utf8", flag: "r" });
          const assignment = contents
            .replace(/^\uFEFF/, "")
            .split(/\r?\n/)
            .find((line) => /^\s*(?:export\s+)?DATABASE_URL\s*=/.test(line));

          if (!assignment) {
            console.error("DATABASE_URL is not defined in the remote deployment .env file.");
            process.exit(1);
          }

          let value = assignment.replace(/^\s*(?:export\s+)?DATABASE_URL\s*=\s*/, "").trim();
          if (value.startsWith('"')) {
            try {
              value = JSON.parse(value);
            } catch {
              console.error("DATABASE_URL has invalid double-quoted syntax.");
              process.exit(1);
            }
          } else if (value.startsWith("'")) {
            if (value.length < 2 || !value.endsWith("'")) {
              console.error("DATABASE_URL has invalid single-quoted syntax.");
              process.exit(1);
            }
            value = value.slice(1, -1);
          } else {
            value = value.replace(/\s+#.*$/, "").trim();
          }

          let databaseUrl;
          try {
            databaseUrl = new URL(value);
          } catch {
            console.error("DATABASE_URL is not a valid URL.");
            process.exit(1);
          }
          if (!["postgres:", "postgresql:"].includes(databaseUrl.protocol)) {
            console.error("DATABASE_URL must use the postgres or postgresql protocol.");
            process.exit(1);
          }

          const child = spawn(
            "pg_dump",
            ["--format=custom", "--no-owner", "--no-acl"],
            {
              env: { ...process.env, PGDATABASE: value },
              shell: false,
              stdio: ["ignore", "inherit", "inherit"],
            },
          );
          child.on("error", (error) => {
            console.error(`Unable to start pg_dump: ${error.message}`);
            process.exit(1);
          });
          child.on("exit", (code, signal) => {
            if (signal) {
              console.error(`pg_dump terminated by signal ${signal}.`);
              process.exit(1);
            }
            process.exit(code ?? 1);
          });
          NODE_SCRIPT
          REMOTE_SCRIPT
          chmod 700 "$remote_script"

          printf -v quoted_deploy_path '%q' "$DEPLOY_PATH"
          ssh \
            -p "$DEPLOY_PORT" \
            -i "$SSH_DIR/key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o LogLevel=ERROR \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$SSH_DIR/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- $quoted_deploy_path" \
            < "$remote_script" > "$dump_path"

          [[ -s "$dump_path" ]] || {
            echo "pg_dump produced an empty file."
            exit 1
          }
          pg_restore --list "$dump_path" >/dev/null

          "$RUNNER_TEMP/age-bin/age" \
            --encrypt \
            --recipient "$AGE_RECIPIENT" \
            --output "$encrypted_path" \
            "$dump_path"
          [[ -s "$encrypted_path" ]] || {
            echo "age produced an empty encrypted backup."
            exit 1
          }

      - name: Upload encrypted backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beta-postgres-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/beta-backup/beta-postgres.dump.age
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Securely remove transient files
        if: always()
        shell: bash
        env:
          BACKUP_DIR: ${{ runner.temp }}/beta-backup
          SSH_DIR: ${{ runner.temp }}/beta-backup-ssh
        run: |
          set +e
          for path in \
            "$BACKUP_DIR/beta-postgres.dump" \
            "$BACKUP_DIR/beta-postgres.dump.age" \
            "$BACKUP_DIR/read-only-pg-dump.sh" \
            "$SSH_DIR/key" \
            "$SSH_DIR/known_hosts"
          do
            if [[ -f "$path" ]]; then
              shred --force --iterations=1 --zero --remove "$path"
            fi
          done
          rm -rf -- "$BACKUP_DIR" "$SSH_DIR" "$RUNNER_TEMP/age-bin"
          rm -f -- "$RUNNER_TEMP/age-v1.2.1-linux-amd64.tar.gz"
