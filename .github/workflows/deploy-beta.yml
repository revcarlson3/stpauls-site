name: Deploy beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: beta-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Check out beta
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BETA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BETA_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.BETA_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.BETA_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" ]] || { echo "BETA_DEPLOY_HOST is not configured in the beta environment."; exit 1; }
          [[ -n "$DEPLOY_USER" ]] || { echo "BETA_DEPLOY_USER is not configured in the beta environment."; exit 1; }
          [[ -n "$DEPLOY_KEY" ]] || { echo "BETA_DEPLOY_KEY is not configured in the beta environment."; exit 1; }
          [[ -n "$KNOWN_HOSTS" ]] || { echo "BETA_DEPLOY_KNOWN_HOSTS is not configured in the beta environment."; exit 1; }

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.BETA_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.BETA_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/beta_deploy_key"
          chmod 600 "$HOME/.ssh/beta_deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Sync source to VPS
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BETA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BETA_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.BETA_DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.BETA_DEPLOY_PATH || '/var/www/mychurch' }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/beta_deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'storage' \
            -e "ssh -p $DEPLOY_PORT -i $HOME/.ssh/beta_deploy_key" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Install, build, and restart beta
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BETA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BETA_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.BETA_DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.BETA_DEPLOY_PATH || '/var/www/mychurch' }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/beta_deploy_key" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && npm ci && npm run deployment:check && npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20260918200000_tenant_membership_events/migration.sql && npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20260919090000_scope_event_settings_templates/migration.sql && npm run db:push && npm run db:generate && npm run build && sudo -n systemctl restart stpauls-site"
